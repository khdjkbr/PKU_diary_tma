<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ФКУ Дневник</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    window.onerror = function(msg, url, line) {
      const b = document.getElementById('debugErrorBox');
      if (b) { b.style.display = 'block'; b.textContent = 'Ошибка: ' + msg + ' (' + line + ')'; }
      return false;
    };
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="config.js"></script>
  <script src="products.js"></script>
</head>
<body>

  <div id="debugErrorBox"></div>

  <!-- Шапка -->
  <header class="header">
    <div class="header-top">
      <div class="header-title">🥑 ФКУ Дневник</div>
      <button class="icon-btn" onclick="openModal('settingsModal')">⚙️</button>
    </div>

    <div class="date-nav">
      <button class="date-btn" onclick="changeDate(-1)">◀ Вчера</button>
      <div class="date-display" onclick="openDatePicker()">
        <span>📅</span>
        <span id="dateDisplayLabel">Сегодня</span>
        <span id="todayBadge" class="today-tag">Сегодня</span>
        <input type="date" id="hiddenDatePicker" onchange="onDatePicked(this.value)">
      </div>
      <button class="date-btn" onclick="changeDate(1)">Завтра ▶</button>
    </div>
  </header>

  <div class="container">

    <!-- Баланс Фа -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:11px; font-weight:700; color:#64748b; text-transform:uppercase;">Фенилаланин (Фа)</span>
        <span id="pheStatusBadge" class="badge badge-ok">В норме</span>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-top:6px;">
        <div>
          <span id="consumedPheText" style="font-size:32px; font-weight:800; color:#0f172a;">0</span>
          <span style="font-size:14px; color:#64748b;"> / <span id="limitPheText">300</span> мг</span>
        </div>
        <div style="text-align:right;">
          <div style="font-size:11px; color:#64748b;">Осталось</div>
          <div id="remainingPheText" style="font-size:18px; font-weight:800; color:#10b981;">300 мг</div>
        </div>
      </div>

      <div class="progress-bar-bg">
        <div id="pheProgressBar" class="progress-bar-fill fill-ok" style="width: 0%;"></div>
      </div>

      <div style="display:flex; justify-content:space-between; font-size:12px; color:#64748b; margin-top:4px;">
        <span>Естеств. белок: <b id="consumedProteinText" style="color:#0f172a;">0.0</b> г</span>
        <span>Лимит: <span id="limitProteinText">6.0</span> г</span>
      </div>
    </div>

    <!-- АКС -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:11px; font-weight:700; color:#64748b; text-transform:uppercase;">Смесь (АКС)</span>
        <span id="aksProgressText" style="font-size:12px; font-weight:700; color:#2563eb;">0 / 4 порций</span>
      </div>
      <div class="aks-grid" id="aksContainer"></div>
    </div>

    <!-- Приемы пищи -->
    <div class="card">
      <div class="meal-head"><span class="meal-title">☀️ Завтрак</span><span id="breakfastTotal" style="font-size:12px; color:#64748b; font-weight:600;">0 мг Фа</span></div>
      <div id="breakfastList"></div>
      <button class="btn-add" onclick="openAddFoodModal('Завтрак')">+ Добавить в завтрак</button>
    </div>

    <div class="card">
      <div class="meal-head"><span class="meal-title">🍲 Обед</span><span id="lunchTotal" style="font-size:12px; color:#64748b; font-weight:600;">0 мг Фа</span></div>
      <div id="lunchList"></div>
      <button class="btn-add" onclick="openAddFoodModal('Обед')">+ Добавить в обед</button>
    </div>

    <div class="card">
      <div class="meal-head"><span class="meal-title">🌙 Ужин</span><span id="dinnerTotal" style="font-size:12px; color:#64748b; font-weight:600;">0 мг Фа</span></div>
      <div id="dinnerList"></div>
      <button class="btn-add" onclick="openAddFoodModal('Ужин')">+ Добавить в ужин</button>
    </div>

    <div class="card">
      <div class="meal-head"><span class="meal-title">🍎 Перекус</span><span id="snackTotal" style="font-size:12px; color:#64748b; font-weight:600;">0 мг Фа</span></div>
      <div id="snackList"></div>
      <button class="btn-add" onclick="openAddFoodModal('Перекус')">+ Добавить в перекус</button>
    </div>

  </div>

  <!-- Модалка добавления еды -->
  <div id="addModal" class="modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 id="modalMealTitle" style="font-size:16px; font-weight:700;">Добавить продукт</h3>
        <button class="icon-btn" onclick="closeModal('addModal')">✕</button>
      </div>

      <div class="input-group">
        <input type="text" id="foodSearchInput" class="input-control" placeholder="🔍 Поиск продукта в базе..." oninput="filterFoodList()">
      </div>

      <div class="category-chips">
        <button class="chip active" onclick="setCategory('all', this)">Все</button>
        <button class="chip" onclick="setCategory('veg', this)">🥦 Овощи</button>
        <button class="chip" onclick="setCategory('fruit', this)">🍎 Фрукты</button>
        <button class="chip" onclick="setCategory('special', this)">✨ Спецпродукты</button>
        <button class="chip" onclick="setCategory('sweet', this)">🍬 Сладости</button>
        <button class="chip" onclick="setCategory('grain', this)">🌾 Крупы</button>
      </div>

      <div class="food-search-list" id="foodSearchListContainer"></div>

      <div class="input-group">
        <label class="input-label">Название продукта</label>
        <input type="text" id="foodNameInput" class="input-control" placeholder="Например: Кабачок">
      </div>

      <div class="grid-2">
        <div class="input-group">
          <label class="input-label">Фа на 100г (мг)</label>
          <input type="number" id="phe100Input" class="input-control" placeholder="30" oninput="calcPreview()">
        </div>
        <div class="input-group">
          <label class="input-label">Белок на 100г (г)</label>
          <input type="number" step="0.1" id="prot100Input" class="input-control" placeholder="0.6" oninput="calcPreview()">
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">Вес порции (в граммах)</label>
        <input type="number" id="weightInput" class="input-control input-highlight" placeholder="100" oninput="calcPreview()">
      </div>

      <div style="background:#f1f5f9; padding:10px; border-radius:10px; display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <span style="font-size:12px; color:#64748b;">Итого в порции:</span>
        <span id="previewCalc" style="font-weight:800; color:#10b981; font-size:15px;">0 мг Фа (0.0 г б.)</span>
      </div>

      <button class="btn-primary" onclick="saveFood()">Сохранить в дневник</button>
    </div>
  </div>

  <!-- Модалка настроек -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 style="font-size:16px; font-weight:700;">Настройки нормы</h3>
        <button class="icon-btn" onclick="closeModal('settingsModal')">✕</button>
      </div>
      <div class="input-group">
        <label class="input-label">Суточная норма Фа (мг)</label>
        <input type="number" id="settingDailyPhe" class="input-control">
      </div>
      <div class="input-group">
        <label class="input-label">Количество порций АКС в день</label>
        <input type="number" id="settingAksPortions" class="input-control">
      </div>
      <button class="btn-primary" onclick="saveSettings()">Сохранить настройки</button>
    </div>
  </div>

  <!-- Подключение файла с логикой -->
  <script src="app.js"></script>
</body>
</html>
